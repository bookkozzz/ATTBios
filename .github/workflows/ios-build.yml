# Build ไฟล์ IPA (ยังไม่ sign) บน Mac ของ GitHub
# เอาไฟล์ SGPro-unsigned.ipa จากหน้า Actions ไปติดตั้งลง iPhone ด้วย Sideloadly บน Windows
name: iOS build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build www/ and sync iOS project
        run: npm run sync

      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr SGPro-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SGPro-unsigned-ipa
          path: SGPro-unsigned.ipa
          retention-days: 30
